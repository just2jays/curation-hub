services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PB_VERSION: "${PB_VERSION:-0.39.10}"
    container_name: pocketbase
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: "${PB_SUPERUSER_EMAIL:-}"
      PB_SUPERUSER_PASSWORD: "${PB_SUPERUSER_PASSWORD:-}"
    # not exposed externally — accessed via the nginx proxy
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_public:/pb/pb_public
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: curation_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:80"
    depends_on:
      pocketbase:
        condition: service_healthy